services:
  goapp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: deepwatch-app
    ports:
      - "${APP_HOST_PORT:-8080}:8080"
    environment:
      - APP_PORT=8080
      - LOG_LEVEL=info
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/deepwatch", "-healthcheck"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - monitoring

  prometheus:
    image: prom/prometheus:latest
    container_name: deepwatch-prometheus
    volumes:
      - ./prometheus/:/etc/prometheus/
      - prometheus-data:/prometheus
    ports:
      - "${PROMETHEUS_HOST_PORT:-9090}:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--web.enable-lifecycle'
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - monitoring
    depends_on:
      alertmanager:
        condition: service_healthy
      goapp:
        condition: service_healthy

  grafana:
    image: grafana/grafana:latest
    container_name: deepwatch-grafana
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - grafana-data:/var/lib/grafana
    ports:
      - "${GRAFANA_HOST_PORT:-3000}:3000"
    env_file:
      - ./.env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 15s
    networks:
      - monitoring
    depends_on:
      prometheus:
        condition: service_healthy

  alertmanager:
    build:
      context: .
      dockerfile: alertmanager/Dockerfile
      args:
        - WEBHOOK_URL=${WEBHOOK_URL}
    container_name: deepwatch-alertmanager
    ports:
      - "${ALERTMANAGER_HOST_PORT:-9093}:9093"
    environment:
      - TZ=America/Sao_Paulo
    env_file:
      - ./.env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9093/-/healthy"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - monitoring

networks:
  monitoring:
    driver: bridge

volumes:
  prometheus-data:
  grafana-data:
